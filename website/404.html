<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="요청한 PunchGrow 페이지를 찾을 수 없습니다.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0910">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <title>404 — PunchGrow</title>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="noise" aria-hidden="true"></div>
  <main id="main" class="error-page">
    <section class="error-panel" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">404</p>
      <p class="eyebrow">ROUTE NOT FOUND / 길을 찾을 수 없음</p>
      <h1 id="error-title">이 계보는 아직<br>발견되지 않았습니다.</h1>
      <p>요청한 주소가 이동했거나 존재하지 않습니다. 홈으로 돌아가거나 256종 공개 도감에서 다른 진화 경로를 찾아보세요.</p>
      <p lang="en">This route may have moved or never existed. Return home or explore another lineage in the public creature dex.</p>
      <div class="hero-actions">
        <a class="button button-primary" href="/">홈으로 돌아가기 / Home</a>
        <a class="button button-secondary" href="/dex/">전체 도감 / Full Dex</a>
      </div>
    </section>
  </main>
</body>
</html>

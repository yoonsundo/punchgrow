server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

  location /api/ { proxy_pass http://server:4000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://server:4000; }
  location / { try_files $uri $uri/ /index.html; }
  location /creatures/ { expires 7d; add_header Cache-Control "public, immutable"; }
}

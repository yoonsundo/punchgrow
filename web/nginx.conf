server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://server:4000;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Authorization $http_authorization;
  }
  location = /health {
    proxy_pass http://server:4000;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /creatures/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  }
}

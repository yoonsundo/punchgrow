<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" role="img" aria-labelledby="punchgrow-growth-loop-title punchgrow-growth-loop-desc">
  <title id="punchgrow-growth-loop-title">PunchGrow 크리처 성장 루프</title>
  <desc id="punchgrow-growth-loop-desc">코딩 활동, 로컬 측정, 토큰 적립, 크리처 발견, 먹이와 성장, 진화와 계승이 순환하며 모든 상태는 로컬 세이브에 기록되는 여섯 단계 다이어그램입니다.</desc>

  <style>
    .ring { fill: none; stroke: #a79db5; stroke-width: 1.5; opacity: .64; marker-end: url(#arrow); }
    .ring-accent { stroke: #c6f84e; opacity: .9; marker-end: url(#arrow-accent); }
    .spoke { fill: none; stroke: #4de1ff; stroke-width: 1; stroke-dasharray: 4 6; opacity: .42; marker-end: url(#arrow-link); }
    .station { fill: #141020; stroke: rgba(244, 241, 250, .14); stroke-width: 1; }
    .station-focus { fill: #1e2116; stroke: #c6f84e; stroke-width: 1.5; }
    .step { fill: #231a33; stroke: rgba(244, 241, 250, .14); stroke-width: 1; }
    .step-focus { fill: #c6f84e; stroke: #c6f84e; }
    .step-number { fill: #a79db5; font: 700 9px ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; letter-spacing: .06em; text-anchor: middle; }
    .step-number-focus { fill: #0b0910; }
    .station-title { fill: #f4f1fa; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif; }
    .station-note { fill: #a79db5; font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif; letter-spacing: .01em; }
    .station-note-focus { fill: #c6f84e; }
    .hub { fill: #231a33; stroke: #4de1ff; stroke-width: 1.5; }
    .hub-kicker { fill: #4de1ff; font: 700 9px ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; letter-spacing: .14em; text-anchor: middle; }
    .hub-title { fill: #f4f1fa; font: 750 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif; letter-spacing: -.02em; text-anchor: middle; }
    .hub-note { fill: #a79db5; font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif; text-anchor: middle; }
    .data-label-bg { fill: #0b0910; stroke: rgba(244, 241, 250, .14); stroke-width: 1; }
    .data-label { fill: #4de1ff; font: 700 8px ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; letter-spacing: .1em; text-anchor: middle; }
    .legend-rule { stroke: rgba(244, 241, 250, .14); stroke-width: 1; }
    .legend-text { fill: #a79db5; font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif; }
    .legend-meta { fill: #a79db5; font: 500 10px ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; letter-spacing: .05em; text-anchor: end; }
  </style>

  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f4f1fa" opacity=".055" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a79db5" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#c6f84e" />
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#4de1ff" />
    </marker>
  </defs>

  <rect x=".5" y=".5" width="1039" height="679" rx="8" fill="#0b0910" stroke="#342e3d" />
  <rect x="1" y="1" width="1038" height="634" rx="8" fill="url(#dot-grid)" />

  <g aria-hidden="true">
    <path class="ring" d="M600 113.726A240 240 0 0 1 704.969 187.073" />
    <path class="ring" d="M743.285 252A240 240 0 0 1 743.722 426.882" />
    <path class="ring ring-accent" d="M705.731 492A240 240 0 0 1 601.13 565.871" />
    <path class="ring" d="M440 566.274A240 240 0 0 1 335.031 492.927" />
    <path class="ring" d="M296.715 428A240 240 0 0 1 296.278 253.118" />
    <path class="ring" d="M334.269 188A240 240 0 0 1 438.87 114.129" />

    <path class="spoke" d="M520 132V280" />
    <path class="spoke" d="M672 252 616 284" />
    <path class="spoke" d="M672 428 616 396" />
    <path class="spoke" d="M520 548V400" />
    <path class="spoke" d="M368 428 424 396" />
    <path class="spoke" d="M368 252 424 284" />

    <g transform="translate(496 199)">
      <rect class="data-label-bg" width="48" height="18" rx="3" />
      <text class="data-label" x="24" y="12">USAGE</text>
    </g>
    <g transform="translate(620 348)">
      <rect class="data-label-bg" width="52" height="18" rx="3" />
      <text class="data-label" x="26" y="12">WALLET</text>
    </g>
    <g transform="translate(368 348)">
      <rect class="data-label-bg" width="44" height="18" rx="3" />
      <text class="data-label" x="22" y="12">DEX</text>
    </g>
  </g>

  <g transform="translate(440 68)">
    <rect class="station" width="160" height="64" rx="6" />
    <circle class="step" cx="20" cy="21" r="10" />
    <text class="step-number" x="20" y="24">01</text>
    <text class="station-title" x="40" y="25">코딩 활동</text>
    <text class="station-note" x="16" y="48">Claude · Codex</text>
  </g>

  <g transform="translate(648 188)">
    <rect class="station" width="160" height="64" rx="6" />
    <circle class="step" cx="20" cy="21" r="10" />
    <text class="step-number" x="20" y="24">02</text>
    <text class="station-title" x="40" y="25">로컬 측정</text>
    <text class="station-note" x="16" y="48">숫자 증가분만</text>
  </g>

  <g transform="translate(648 428)">
    <rect class="station-focus" width="160" height="64" rx="6" />
    <circle class="step step-focus" cx="20" cy="21" r="10" />
    <text class="step-number step-number-focus" x="20" y="24">03</text>
    <text class="station-title" x="40" y="25">토큰 적립</text>
    <text class="station-note station-note-focus" x="16" y="48">사용량 → 잔액</text>
  </g>

  <g transform="translate(440 548)">
    <rect class="station" width="160" height="64" rx="6" />
    <circle class="step" cx="20" cy="21" r="10" />
    <text class="step-number" x="20" y="24">04</text>
    <text class="station-title" x="40" y="25">크리처 발견</text>
    <text class="station-note" x="16" y="48">500K 가챠</text>
  </g>

  <g transform="translate(232 428)">
    <rect class="station" width="160" height="64" rx="6" />
    <circle class="step" cx="20" cy="21" r="10" />
    <text class="step-number" x="20" y="24">05</text>
    <text class="station-title" x="40" y="25">먹이와 성장</text>
    <text class="station-note" x="16" y="48">XP · 친밀도</text>
  </g>

  <g transform="translate(232 188)">
    <rect class="station" width="160" height="64" rx="6" />
    <circle class="step" cx="20" cy="21" r="10" />
    <text class="step-number" x="20" y="24">06</text>
    <text class="station-title" x="40" y="25">진화와 계승</text>
    <text class="station-note" x="16" y="48">분기 · 도감 확장</text>
  </g>

  <g>
    <rect class="hub" x="420" y="288" width="200" height="104" rx="8" />
    <text class="hub-kicker" x="520" y="314">LOCAL ONLY</text>
    <text class="hub-title" x="520" y="348">로컬 세이브</text>
    <text class="hub-note" x="520" y="373">토큰 · 개체 · 도감</text>
  </g>

  <g aria-hidden="true">
    <line class="legend-rule" x1="40" y1="636" x2="1000" y2="636" />
    <path d="M40 658H68" fill="none" stroke="#a79db5" stroke-width="1.5" marker-end="url(#arrow)" />
    <text class="legend-text" x="78" y="662">게임 흐름</text>
    <path d="M176 658H204" fill="none" stroke="#4de1ff" stroke-width="1" stroke-dasharray="4 5" />
    <text class="legend-text" x="214" y="662">로컬 기록</text>
    <rect x="304" y="652" width="12" height="12" rx="2" fill="#c6f84e" />
    <text class="legend-text" x="326" y="662">핵심 전환</text>
    <text class="legend-meta" x="1000" y="662">LOOP · DOC-WIDE · STATIC SVG</text>
  </g>
</svg>

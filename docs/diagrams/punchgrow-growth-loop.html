<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PunchGrow 성장 루프</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #0b0910;
      --surface: #141020;
      --raised: #231a33;
      --ink: #f4f1fa;
      --muted: #a79db5;
      --accent: #c6f84e;
      --accent-tint: rgba(198, 248, 78, 0.1);
      --link: #4de1ff;
      --rare: #ffb84d;
      --rule: rgba(244, 241, 250, 0.14);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -12%, rgba(77, 225, 255, 0.08), transparent 36rem),
        var(--paper);
      font-family: var(--sans);
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 52px 24px 40px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: end;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font: 700 12px/1 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(30px, 4.3vw, 52px);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .intro {
      max-width: 310px;
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      text-align: right;
    }

    .diagram-shell {
      overflow-x: auto;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: rgba(20, 16, 32, 0.72);
      scrollbar-color: var(--raised) var(--surface);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 900px;
      height: auto;
    }

    .ring {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.5;
      opacity: 0.64;
      marker-end: url(#arrow);
    }

    .ring-accent {
      stroke: var(--accent);
      opacity: 0.9;
      marker-end: url(#arrow-accent);
    }

    .spoke {
      fill: none;
      stroke: var(--link);
      stroke-width: 1;
      stroke-dasharray: 4 6;
      opacity: 0.42;
      marker-end: url(#arrow-link);
    }

    .station {
      fill: var(--surface);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .station-focus {
      fill: var(--accent-tint);
      stroke: var(--accent);
      stroke-width: 1.5;
    }

    .step {
      fill: var(--raised);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .step-focus {
      fill: var(--accent);
      stroke: var(--accent);
    }

    .step-number {
      fill: var(--muted);
      font: 700 9px/1 var(--mono);
      letter-spacing: 0.06em;
      text-anchor: middle;
    }

    .step-number-focus {
      fill: var(--paper);
    }

    .station-title {
      fill: var(--ink);
      font: 700 14px/1 var(--sans);
    }

    .station-note {
      fill: var(--muted);
      font: 500 10px/1 var(--sans);
      letter-spacing: 0.01em;
    }

    .station-note-focus {
      fill: var(--accent);
    }

    .hub {
      fill: var(--raised);
      stroke: var(--link);
      stroke-width: 1.5;
    }

    .hub-kicker {
      fill: var(--link);
      font: 700 9px/1 var(--mono);
      letter-spacing: 0.14em;
      text-anchor: middle;
    }

    .hub-title {
      fill: var(--ink);
      font: 750 22px/1 var(--sans);
      letter-spacing: -0.02em;
      text-anchor: middle;
    }

    .hub-note {
      fill: var(--muted);
      font: 500 11px/1 var(--sans);
      text-anchor: middle;
    }

    .data-label-bg {
      fill: var(--paper);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .data-label {
      fill: var(--link);
      font: 700 8px/1 var(--mono);
      letter-spacing: 0.1em;
      text-anchor: middle;
    }

    .legend-rule {
      stroke: var(--rule);
      stroke-width: 1;
    }

    .legend-text,
    .legend-meta {
      fill: var(--muted);
      font: 500 10px/1 var(--sans);
    }

    .legend-meta {
      font-family: var(--mono);
      letter-spacing: 0.05em;
      text-anchor: end;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 14px;
      color: var(--muted);
      font: 500 11px/1.5 var(--mono);
    }

    @media (max-width: 760px) {
      main {
        padding: 32px 16px 28px;
      }

      header {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .intro {
        max-width: 560px;
        text-align: left;
      }

      footer {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">PunchGrow · System loop</p>
        <h1>코딩이 크리처의<br>성장으로 이어지는 방식</h1>
      </div>
      <p class="intro">Claude와 Codex의 로컬 사용량이 토큰이 되고, 발견과 성장을 거쳐 다음 크리처로 이어집니다.</p>
    </header>

    <section class="diagram-shell" aria-label="PunchGrow 성장 루프 다이어그램">
      <svg viewBox="0 0 1040 680" role="img" aria-labelledby="punchgrow-growth-loop-title punchgrow-growth-loop-desc">
        <title id="punchgrow-growth-loop-title">PunchGrow 크리처 성장 루프</title>
        <desc id="punchgrow-growth-loop-desc">코딩 활동, 로컬 측정, 토큰 적립, 크리처 발견, 먹이와 성장, 진화와 계승이 순환하며 모든 상태는 로컬 세이브에 기록되는 여섯 단계 다이어그램입니다.</desc>

        <defs>
          <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#f4f1fa" opacity="0.055"></circle>
          </pattern>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a79db5"></path>
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c6f84e"></path>
          </marker>
          <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4de1ff"></path>
          </marker>
        </defs>

        <rect width="1040" height="680" fill="#0b0910"></rect>
        <rect width="1040" height="636" fill="url(#dot-grid)"></rect>

        <g aria-hidden="true">
          <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073"></path>
          <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882"></path>
          <path class="ring ring-accent" d="M705.731 492 A240 240 0 0 1 601.13 565.871"></path>
          <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927"></path>
          <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118"></path>
          <path class="ring" d="M334.269 188 A240 240 0 0 1 438.87 114.129"></path>

          <path class="spoke" d="M520 132 V280"></path>
          <path class="spoke" d="M672 252 L616 284"></path>
          <path class="spoke" d="M672 428 L616 396"></path>
          <path class="spoke" d="M520 548 V400"></path>
          <path class="spoke" d="M368 428 L424 396"></path>
          <path class="spoke" d="M368 252 L424 284"></path>

          <g transform="translate(496 199)">
            <rect class="data-label-bg" width="48" height="18" rx="3"></rect>
            <text class="data-label" x="24" y="12">USAGE</text>
          </g>
          <g transform="translate(620 348)">
            <rect class="data-label-bg" width="52" height="18" rx="3"></rect>
            <text class="data-label" x="26" y="12">WALLET</text>
          </g>
          <g transform="translate(368 348)">
            <rect class="data-label-bg" width="44" height="18" rx="3"></rect>
            <text class="data-label" x="22" y="12">DEX</text>
          </g>
        </g>

        <g transform="translate(440 68)">
          <rect class="station" width="160" height="64" rx="6"></rect>
          <circle class="step" cx="20" cy="21" r="10"></circle>
          <text class="step-number" x="20" y="24">01</text>
          <text class="station-title" x="40" y="25">코딩 활동</text>
          <text class="station-note" x="16" y="48">Claude · Codex</text>
        </g>

        <g transform="translate(648 188)">
          <rect class="station" width="160" height="64" rx="6"></rect>
          <circle class="step" cx="20" cy="21" r="10"></circle>
          <text class="step-number" x="20" y="24">02</text>
          <text class="station-title" x="40" y="25">로컬 측정</text>
          <text class="station-note" x="16" y="48">숫자 증가분만</text>
        </g>

        <g transform="translate(648 428)">
          <rect class="station-focus" width="160" height="64" rx="6"></rect>
          <circle class="step step-focus" cx="20" cy="21" r="10"></circle>
          <text class="step-number step-number-focus" x="20" y="24">03</text>
          <text class="station-title" x="40" y="25">토큰 적립</text>
          <text class="station-note station-note-focus" x="16" y="48">사용량 → 잔액</text>
        </g>

        <g transform="translate(440 548)">
          <rect class="station" width="160" height="64" rx="6"></rect>
          <circle class="step" cx="20" cy="21" r="10"></circle>
          <text class="step-number" x="20" y="24">04</text>
          <text class="station-title" x="40" y="25">크리처 발견</text>
          <text class="station-note" x="16" y="48">500K 가챠</text>
        </g>

        <g transform="translate(232 428)">
          <rect class="station" width="160" height="64" rx="6"></rect>
          <circle class="step" cx="20" cy="21" r="10"></circle>
          <text class="step-number" x="20" y="24">05</text>
          <text class="station-title" x="40" y="25">먹이와 성장</text>
          <text class="station-note" x="16" y="48">XP · 친밀도</text>
        </g>

        <g transform="translate(232 188)">
          <rect class="station" width="160" height="64" rx="6"></rect>
          <circle class="step" cx="20" cy="21" r="10"></circle>
          <text class="step-number" x="20" y="24">06</text>
          <text class="station-title" x="40" y="25">진화와 계승</text>
          <text class="station-note" x="16" y="48">분기 · 도감 확장</text>
        </g>

        <g>
          <rect class="hub" x="420" y="288" width="200" height="104" rx="8"></rect>
          <text class="hub-kicker" x="520" y="314">LOCAL ONLY</text>
          <text class="hub-title" x="520" y="348">로컬 세이브</text>
          <text class="hub-note" x="520" y="373">토큰 · 개체 · 도감</text>
        </g>

        <g aria-hidden="true">
          <line class="legend-rule" x1="40" y1="636" x2="1000" y2="636"></line>
          <path d="M40 658 H68" fill="none" stroke="#a79db5" stroke-width="1.5" marker-end="url(#arrow)"></path>
          <text class="legend-text" x="78" y="662">게임 흐름</text>
          <path d="M176 658 H204" fill="none" stroke="#4de1ff" stroke-width="1" stroke-dasharray="4 5"></path>
          <text class="legend-text" x="214" y="662">로컬 기록</text>
          <rect x="304" y="652" width="12" height="12" rx="2" fill="#c6f84e"></rect>
          <text class="legend-text" x="326" y="662">핵심 전환</text>
          <text class="legend-meta" x="1000" y="662">LOOP · DOC-WIDE · STATIC SVG</text>
        </g>
      </svg>
    </section>

    <footer>
      <span>Brand source: PunchGrow design tokens</span>
      <span>Private by design · No cloud sync</span>
    </footer>
  </main>
</body>
</html>

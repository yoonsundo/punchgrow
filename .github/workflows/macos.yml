name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test
      - name: Build release app
        run: ./scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict .build/PunchGrow.app
